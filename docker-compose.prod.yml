# 서버에서 실행하는 배포용 compose 파일.
# - CD 워크플로: `docker compose -f docker-compose.prod.yml pull && up -d` (GHCR 이미지)
# - 서버에서 직접 빌드: `docker compose -f docker-compose.prod.yml up -d --build`
# 비밀값은 같은 디렉터리의 .env 에 둔다(.env.example 참고, git 에 올리지 않음).
services:
  app:
    image: ghcr.io/nemu-nyangko/place-server:latest
    build: .
    restart: always
    # 앱 포트는 외부에 직접 노출하지 않는다 — 리버스 프록시(HTTPS)만 접근.
    # (ClientIp 가 프록시의 X-Real-IP 를 신뢰하기 때문)
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx${APP_HEAP:-768m} -XX:+UseZGC"
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:?AUTH_TOKEN_SECRET 를 .env 에 설정하세요}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS 를 .env 에 설정하세요}
      DATAGSM_CLIENT_ID: ${DATAGSM_CLIENT_ID:-}
      DATAGSM_CLIENT_SECRET: ${DATAGSM_CLIENT_SECRET:-}
      DATAGSM_REDIRECT_URI: ${DATAGSM_REDIRECT_URI:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  default:
    driver_opts:
      # 호스트 네트워크 MTU 가 1500 보다 작으면(VPN/터널 환경) 맞춰 줘야 외부 HTTPS 핸드셰이크가 멈추지 않는다
      com.docker.network.driver.mtu: ${DOCKER_MTU:-1500}

volumes:
  redis-data:
