# Nginx Proxy Manager 같은 컨테이너 리버스 프록시와 같은 Docker 네트워크에 붙이는 오버레이.
# 사용: docker compose -f docker-compose.prod.yml -f docker-compose.proxy.yml up -d --build
# 프록시에서는 forward host = place-server-app-1 (또는 서비스명 app), port = 8080 으로 지정.
services:
  app:
    networks:
      default:
        # 외부(DataGSM, OpenAI)로 나가는 기본 경로는 MTU 를 맞춘 자체 네트워크로
        gw_priority: 1
      proxy: {}

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-my-cloud_default}
