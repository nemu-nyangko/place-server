spring:
  application:
    name: NonePlace
  data:
    redis:
      host: 127.0.0.1
      port: 6379

server:
  port: 8080
  shutdown: graceful

canvas:
  # 비로그인(게스트): QR 찍자마자 바로 참여
  guest:
    max-stock: 10
    regen-seconds: 30
  # DataGSM 로그인 회원: 픽셀 3배, 충전 2배 빠름 + AI 리터치
  member:
    max-stock: 30
    regen-seconds: 15
  ai-retouch-cooldown-seconds: 600
  guest-pixels-per-ip-per-minute: 1200
  broadcast-interval-ms: 50

auth:
  token-secret: ${AUTH_TOKEN_SECRET:local-dev-only-secret-please-change-0123456789}
  member-token-ttl-days: 30
  guest-token-ttl-days: 365
  guest-issue-per-ip-per-minute: 300
  # 관리자 DataGSM 계정 id (쉼표 구분). 관리자는 픽셀 무제한
  admin-ids: ${ADMIN_IDS:}
  datagsm:
    client-id: ${DATAGSM_CLIENT_ID:}
    client-secret: ${DATAGSM_CLIENT_SECRET:}
    redirect-uri: ${DATAGSM_REDIRECT_URI:http://localhost:8080/api/auth/datagsm/callback}

openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-5.4-mini}
  # 추론 모델(gpt-5 계열)용. gpt-4.1 계열로 바꾸면 비워야 한다
  reasoning-effort: ${OPENAI_REASONING_EFFORT:low}
  base-url: https://api.openai.com/v1
  timeout-seconds: 60

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

---
spring:
  config:
    activate:
      on-profile: prod

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
